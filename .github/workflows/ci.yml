name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  # Only after all tests pass, and only for pushes to main: build the Docker
  # image and publish it to GitHub Container Registry (ghcr.io).
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to ghcr.io with the workflow's short-lived token
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build image
        run: >
          docker build
          --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          -t "$IMAGE:${{ github.sha }}"
          -t "$IMAGE:latest"
          .
      - name: Push image
        run: docker push --all-tags "$IMAGE"

  # After the image is published: point the Azure Container App at that exact image.
  # Logs in with OIDC (a short-lived token GitHub issues per run); no Azure password is stored.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets this job request the OIDC token that Azure trusts
    concurrency:
      group: deploy-azure
      cancel-in-progress: false
    env:
      APP: scarletwatch
      RG: scarletwatch-rg
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy new image to Azure Container Apps
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update --name "$APP" --resource-group "$RG" --image "$IMAGE" --output none
      - name: Verify the app is running the new image
        run: |
          running=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query "properties.template.containers[0].image" --output tsv)
          state=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query "properties.provisioningState" --output tsv)
          echo "running image: $running"
          echo "provisioning state: $state"
          test "$running" = "$IMAGE" && test "$state" = "Succeeded"
